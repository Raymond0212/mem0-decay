[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mem0-decay"
version = "0.1.0"
description = "Time-aware ranking and scoped lifecycle management for Mem0 OSS and Qdrant"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mem0", "qdrant", "memory", "decay"]

[project.optional-dependencies]
oss = ["mem0ai>=2.2.1,<2.3", "qdrant-client>=1.20,<2"]
server = ["mem0-decay[oss]", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[tool.setuptools.packages.find]
include = ["mem0_decay*"]
